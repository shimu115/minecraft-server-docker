services:
  minecraft-server:
    image: shimu778/minecraft-server:v1.0.0
    container_name: minecraft-server-1.12.2-forge-2
    ports:
      - "25565:25565"
    environment:
      JAVA_VERSION: "8"
      SERVER_TYPE: forge
      DOWNLOAD_URL: "https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2864/forge-1.12.2-14.23.5.2864-installer.jar"
      Xms: "1024M"
      Xmx: "4096M"
      TZ: Asia/Shanghai
    volumes:
      - ./minecraft:/minecraft

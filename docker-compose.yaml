services:
  minecraft-server:
    image: shimu/minecraft-server:api-dev
    container_name: minecraft-server-1.12.2-forge-2
    ports:
      - "25565:25565"
      - "25560:25560"
    restart: always
    environment:
      MC_VERSION: "1.12.2"
      SERVER_TYPE: forge
      Xms: "1024M"
      Xmx: "4096M"
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # 运行此容器即代表您同意 Minecraft 的 EULA 协议 (https://aka.ms/MinecraftEULA)
      # eula.txt 中的原内容：
      # By changing the setting below to TRUE you are indicating your agreement to our EULA (https://aka.ms/MinecraftEULA).
      EULA: true
    volumes:
      - /home/shimu/IdeaProjects/minecraft-server-docker/minecraft:/minecraft
